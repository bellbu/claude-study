<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}RSS Wiki{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232563eb'/%3E%3Ccircle cx='4.5' cy='11.5' r='1.6' fill='white'/%3E%3Cpath d='M3 7a6 6 0 0 1 6 6M3 3.5A9.5 9.5 0 0 1 12.5 13' stroke='white' stroke-width='1.6' fill='none'/%3E%3C/svg%3E">
{% block head %}{% endblock %}
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<style>
:root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --line:#e7e5e4; --card:#fff; --accent:#2563eb; --warn:#b45309; --bad:#b91c1c; --mark:#fde68a; }
@media (prefers-color-scheme: dark) { :root { --bg:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --line:#44403c; --card:#292524; --accent:#60a5fa; --warn:#f59e0b; --bad:#f87171; --mark:#854d0e; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.65 system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
nav { display:flex; flex-wrap:wrap; gap:4px 16px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--card); }
nav .brand { font-weight:700; color:var(--fg); margin-right:8px; }
main { max-width:960px; margin:0 auto; padding:20px 16px 60px; }
h1 { font-size:1.5rem; margin:0 0 12px; } h2 { font-size:1.15rem; margin:28px 0 8px; }
.muted { color:var(--muted); font-size:.9em; }
.flash { padding:8px 12px; border:1px solid var(--line); border-left:4px solid var(--accent); background:var(--card); margin-bottom:16px; }
.warn { border-left-color:var(--warn); } .bad { color:var(--bad); }
.cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:12px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; }
.card h3 { margin:0 0 6px; font-size:1.05rem; }
.card ul { padding-left:18px; margin:6px 0 0; }
.table-wrap { overflow-x:auto; }
.table-wrap table { min-width:640px; }
.table-wrap th { white-space:nowrap; }
table { width:100%; border-collapse:collapse; font-size:.92em; }
th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
form.inline { display:inline-flex; flex-wrap:wrap; gap:4px; align-items:center; margin:0 0 4px; }
input, select, button, textarea { font:inherit; padding:4px 8px; border:1px solid var(--line); border-radius:4px; background:var(--card); color:var(--fg); max-width:100%; }
button { cursor:pointer; } button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
.wiki { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:4px 24px 20px; overflow-wrap:anywhere; }
.wiki .footnote { font-size:.88em; color:var(--muted); }
mark { background:var(--mark); color:inherit; }
pre.diff { background:var(--card); border:1px solid var(--line); padding:12px; overflow-x:auto; font-size:.85em; }
.add { color:#15803d; } .del { color:var(--bad); }
.tag { display:inline-block; font-size:.8em; padding:0 6px; border:1px solid var(--line); border-radius:10px; color:var(--muted); }
</style>
</head>
<body hx-boost="true">
<nav>
  <a class="brand" href="/">RSS Wiki</a>
  <a href="/">홈</a><a href="/topics">주제</a><a href="/articles">글</a><a href="/feeds">피드</a>
  <a href="/search">검색</a><a href="/jobs">작업</a><a href="/settings">설정</a>
</nav>
<main>
{% if msg %}<div class="flash">{{ msg }}</div>{% endif %}
{% if budget_exceeded %}<div class="flash warn">오늘 LLM 비용 상한에 도달했습니다. 남은 글은 내일 이어서 처리합니다. (<a href="/settings">설정</a>)</div>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
