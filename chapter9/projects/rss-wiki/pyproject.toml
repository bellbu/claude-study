[project]
name = "rss-wiki"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = 'BELLBU\bellb', email = "bellbu@naver.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.3.0",
    "feedparser>=6.0.14",
    "flask>=3.1.3",
    "httpx>=0.28.1",
    "trafilatura>=2.3.1",
]

[project.scripts]
rss-wiki = "rss_wiki:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]
