<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}rss-wiki{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">rss-wiki</a>
    <nav class="nav">
      <a href="/feeds"{% if active == "feeds" %} aria-current="page"{% endif %}>피드</a>
      <span class="nav-disabled" aria-disabled="true">수집하기 (준비 중)</span>
      <span class="nav-disabled" aria-disabled="true">글 (준비 중)</span>
    </nav>
  </header>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <div class="flash flash-{{ category }}" role="status">{{ message }}</div>
    {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
